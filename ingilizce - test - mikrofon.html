<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whose Is It? – Mikrofonlu Alıştırma (Revize)</title>
<style>
:root{
  --bg:#f1eeff; --card:#fff; --ink:#23304a; --mut:#4d5772;
  --btn:#5b4bd6; --btnt:#fff; --gold:#e8b100;
  --ok:#2e9e5b; --no:#d9534f; --mic:#e24b4b; --warn:#f0a020;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171a2b;--card:#232842;--ink:#f1f3fb;--mut:#b8bfd8;--btn:#9d92ff;--btnt:#15172a;--gold:#ffd95a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  min-height:100%; padding:14px;
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
}
main{max-width:760px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 6px}
.hud{color:var(--mut);font-weight:700;font-size:.9rem;margin-bottom:12px}
.card{
  background:var(--card);border-radius:22px;padding:18px;
  box-shadow:0 3px 0 rgba(80,70,160,.18);
}
#phase{
  display:inline-block;font-size:.8rem;font-weight:800;
  color:var(--btnt);background:var(--btn);
  padding:3px 12px;border-radius:999px;margin-bottom:10px;
}
#trLine{
  font-size:clamp(1.25rem,4.3vw,1.8rem);font-weight:800;
  margin:0 0 6px;line-height:1.3;
}
#enHint{
  font-size:clamp(1rem,3.5vw,1.3rem);font-weight:700;
  color:var(--mut);margin:0 0 14px;min-height:1.4em;
  font-style:italic;transition:color .2s;
}
#enHint.show{color:var(--ok)}
#heard{
  margin:10px 0 0;padding:10px 14px;border-radius:14px;
  background:#f3f0ff;color:var(--ink);
  font-weight:700;font-size:1rem;min-height:1.4em;
  border:2px dashed #c9c1f0;word-break:break-word;
}
#heard.listening{border-color:var(--mic);background:#ffecec;color:var(--mic);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,75,75,.5)}50%{box-shadow:0 0 0 10px rgba(226,75,75,0)}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button.act{
  font:inherit;font-weight:800;font-size:1.05rem;
  padding:12px 22px;border-radius:999px;border:0;
  background:var(--btn);color:var(--btnt);cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}
button.alt{background:transparent;color:var(--ink);border:3px solid var(--btn);box-shadow:none}
button.mic{background:var(--mic);color:#fff}
button.mic.listening{animation:pulse 1.2s infinite;background:#b33030}
button:disabled{opacity:.4;cursor:not-allowed}
button:active{transform:translateY(2px)}
#msg{text-align:center;font-weight:800;min-height:1.6em;margin:14px 0 0;font-size:1.05rem;line-height:1.4}
#msg.ok{color:var(--ok)}
#msg.no{color:var(--no)}
#msg.warn{color:var(--warn)}
#stars{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  display:flex;justify-content:center;
  padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));
  pointer-events:none;
}
#starPill{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 22px;border-radius:999px;
  background:var(--card);border:3px solid var(--gold);
  font-weight:900;font-size:1.2rem;
  box-shadow:0 0 18px rgba(255,200,40,.55),0 4px 0 rgba(0,0,0,.18);
}
#starPill.bump{animation:bump .35s}
#starPill.loss{animation:shake .45s}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.96)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#starNum{font-size:1.5rem;color:var(--gold);min-width:1.2em;text-align:center}
.star{font-size:1.6rem;line-height:1}
.star.off{opacity:.25}
#micStatus{font-size:.85rem;color:var(--mut);margin-top:10px;text-align:center;line-height:1.5}
#micStatus.bad{color:var(--no);font-weight:700}
#micStatus.good{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Whose Is It? – Mikrofonlu Alıştırma</h1>
  <div class="hud">
    <span id="prog">Soru: 1 / 25</span> ·
    <span id="remain">Kalan: 25</span> ·
    <span id="phase">🎤 Mikrofonla Cevap</span>
  </div>

  <div class="card">
    <p id="trLine">Yükleniyor…</p>
    <p id="enHint"></p>
    <div id="heard">Henüz dinlenmedi.</div>
    <div class="row">
      <button class="act mic" id="btnMic">🎤 Mikrofonu Aç / Konuş</button>
      <button class="act alt" id="btnSpeak">🔊 Doğru Cevabı Dinle</button>
      <button class="act alt" id="btnSkip">⏭ Geç</button>
    </div>
    <p id="msg"></p>
    <p id="micStatus"></p>
  </div>
</main>

<div id="stars">
  <div id="starPill">
    <span class="star" id="s1">⭐</span>
    <span class="star" id="s2">⭐</span>
    <span class="star" id="s3">⭐</span>
    <span class="star" id="s4">⭐</span>
    <span class="star" id="s5">⭐</span>
    <span id="starNum">0</span>
  </div>
</div>

<script>
/* ============================================================
   25 CÜMLE
   ============================================================ */
const POOL = [
  { tr:"Bu kimin kalemi?",                         en:"Whose pen is this?" },
  { tr:"Şu çanta benim.",                           en:"That bag is mine." },
  { tr:"Bu kitap senin mi?",                        en:"Is this book yours?" },
  { tr:"Onun (erkek) arabası çok hızlı.",           en:"His car is very fast." },
  { tr:"Onun (kadın) elbisesi yeni.",               en:"Her dress is new." },
  { tr:"Bu ev bizim.",                              en:"This house is ours." },
  { tr:"Şu ayakkabılar onların.",                   en:"Those shoes are theirs." },
  { tr:"Ali'nin bisikleti kırmızı.",                en:"Ali's bike is red." },
  { tr:"Öğretmenin masası büyük.",                  en:"The teacher's desk is big." },
  { tr:"Bu kimin şapkası?",                         en:"Whose hat is this?" },
  { tr:"Bu telefon benim değil.",                   en:"This phone is not mine." },
  { tr:"Senin anahtarın nerede?",                   en:"Where is your key?" },
  { tr:"Onun (kadın) defteri masada.",              en:"Her notebook is on the table." },
  { tr:"Bu kediler kimin?",                         en:"Whose cats are these?" },
  { tr:"Bu oyuncaklar onların.",                    en:"These toys are theirs." },
  { tr:"Benim gözlüğüm mavi.",                      en:"My glasses are blue." },
  { tr:"Onun (erkek) adı Ahmet.",                   en:"His name is Ahmet." },
  { tr:"Bu araba bizim mi?",                        en:"Is this car ours?" },
  { tr:"Çocuğun oyuncak ayısı yumuşak.",            en:"The child's teddy bear is soft." },
  { tr:"Senin saçların uzun.",                      en:"Your hair is long." },
  { tr:"Onun (kadın) çantası pahalı.",              en:"Her bag is expensive." },
  { tr:"Bu defterler bizim.",                       en:"These notebooks are ours." },
  { tr:"Şu kedi onların mı?",                       en:"Is that cat theirs?" },
  { tr:"Benim evim küçük ama rahat.",               en:"My house is small but comfortable." },
  { tr:"Onun (erkek) telefonu yeni.",               en:"His phone is new." }
];
const TOTAL = POOL.length;

/* ============================================================
   DURUM
   ============================================================ */
const state = {
  idx: 0,
  stars: 0,
  answered: false,
  listening: false,
  recognition: null,
  micReady: false,
  micGranted: false,
  micError: ''
};

const $ = id => document.getElementById(id);

/* ============================================================
   YILDIZ
   ============================================================ */
function updateStars() {
  $('starNum').textContent = state.stars;
  for (let i = 1; i <= 5; i++) {
    $('s' + i).classList.toggle('off', i > state.stars);
  }
}
function bumpStars() {
  const pill = $('starPill');
  pill.classList.remove('bump'); void pill.offsetWidth;
  pill.classList.add('bump');
}
function shakeStars() {
  const pill = $('starPill');
  pill.classList.remove('loss'); void pill.offsetWidth;
  pill.classList.add('loss');
}

/* ============================================================
   METİN NORMALİZASYON + BENZERLİK
   ============================================================ */
function normalize(s) {
  return s.toLowerCase()
    .replace(/[’']/g, "'")
    .replace(/[^\w\s']/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function words(s) { return normalize(s).split(' ').filter(Boolean); }
function wordSimilarity(a, b) {
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = Math.min(
        dp[i-1][j] + 1, dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
  return 1 - dp[m][n] / Math.max(m, n);
}
function sentenceSimilarity(said, expected) {
  const A = words(said), B = words(expected);
  if (!A.length) return 0;
  let matched = 0;
  const used = new Array(B.length).fill(false);
  for (const a of A) {
    let best = -1, bestSim = 0.7;
    for (let j = 0; j < B.length; j++) {
      if (used[j]) continue;
      const sim = wordSimilarity(a, B[j]);
      if (sim > bestSim) { bestSim = sim; best = j; }
    }
    if (best >= 0) { used[best] = true; matched++; }
  }
  return matched / Math.max(A.length, B.length);
}

/* ============================================================
   ORTAM KONTROLÜ (kritik: neden çalışmıyor?)
   ============================================================ */
function checkEnvironment() {
  const msgs = [];

  // 1) Güvenli bağlam kontrolü (en kritik)
  const isSecure = window.isSecureContext ||
                   location.protocol === 'https:' ||
                   location.hostname === 'localhost' ||
                   location.hostname === '127.0.0.1';
  if (!isSecure) {
    msgs.push('❌ <b>Güvenli olmayan bağlam:</b> Sayfa <b>file://</b> veya güvensiz HTTP üzerinden açılmış. Mikrofon sadece <b>https://</b> veya <b>localhost</b> üzerinde çalışır. Dosyayı çift tıklayarak açtıysanız çalışmaz. Çözüm: basit bir yerel sunucu başlatın (<code>python -m http.server</code>) ve <code>http://localhost:8000</code> adresinden açın.');
  }

  // 2) SpeechRecognition desteği
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    msgs.push('❌ <b>Tarayıcı desteği yok:</b> Bu tarayıcı SpeechRecognition API\'sini desteklemiyor. <b>Chrome, Edge veya Safari</b> kullanın. Firefox bu API\'yi desteklemez.');
  }

  // 3) mediaDevices (mikrofon izni için gerekli)
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    msgs.push('❌ <b>Mikrofon API\'si yok:</b> navigator.mediaDevices bulunamadı. HTTPS/localhost kullanın veya tarayıcınızı güncelleyin.');
  }

  if (msgs.length) {
    $('micStatus').innerHTML = msgs.join('<br>');
    $('micStatus').className = 'bad';
    $('btnMic').disabled = true;
    return false;
  }

  $('micStatus').innerHTML = '✅ Ortam uygun. Mikrofon düğmesine basıp izin verin.';
  $('micStatus').className = 'good';
  return true;
}

/* ============================================================
   MİKROFON İZNİ + KONUŞMA TANIMA
   ============================================================ */
async function requestMicAndStart() {
  // Önce getUserMedia ile izin al (SpeechRecognition bazı tarayıcılarda
  // izin olmadan sessizce başarısız olur)
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // İzin alındı, akışı hemen kapat (SpeechRecognition kendi açar)
    stream.getTracks().forEach(t => t.stop());
    state.micGranted = true;
    $('micStatus').innerHTML = '✅ Mikrofon izni verildi. Dinleniyor…';
    $('micStatus').className = 'good';
  } catch (err) {
    state.micGranted = false;
    let m = '❌ Mikrofon izni alınamadı: ' + err.name + ' – ' + err.message;
    if (err.name === 'NotAllowedError') {
      m = '❌ <b>Mikrofon izni reddedildi.</b> Adres çubuğundaki kilit/mikrofon simgesine tıklayıp izin verin, sonra sayfayı yenileyin.';
    } else if (err.name === 'NotFoundError') {
      m = '❌ <b>Mikrofon bulunamadı.</b> Cihazınızda mikrofon bağlı mı?';
    } else if (err.name === 'NotReadableError') {
      m = '❌ <b>Mikrofon başka bir uygulama tarafından kullanılıyor.</b> Diğer uygulamaları kapatın.';
    }
    $('micStatus').innerHTML = m;
    $('micStatus').className = 'bad';
    return;
  }

  // SpeechRecognition başlat
  if (!state.recognition) {
    $('msg').textContent = 'Konuşma tanıma başlatılamadı.';
    $('msg').className = 'no';
    return;
  }
  try {
    state.recognition.start();
  } catch (e) {
    // "already started" hatasını yut
    if (e.message && e.message.includes('already started')) return;
    $('msg').textContent = 'Mikrofon başlatılamadı: ' + e.message;
    $('msg').className = 'no';
  }
}

/* ============================================================
   SPEECH RECOGNITION
   ============================================================ */
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $('btnMic').disabled = true;
    return;
  }

  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;

  rec.onstart = () => {
    state.listening = true;
    $('btnMic').classList.add('listening');
    $('btnMic').textContent = '🎙 Dinliyorum… Konuşun';
    $('heard').textContent = '🎙 Dinliyorum… İngilizce cümleyi söyleyin.';
    $('heard').classList.add('listening');
    $('msg').textContent = '';
    $('msg').className = '';
  };

  rec.onresult = (event) => {
    state.listening = false;
    $('btnMic').classList.remove('listening');
    $('btnMic').textContent = '🎤 Tekrar Konuş';
    $('heard').classList.remove('listening');

    const expected = POOL[state.idx].en;
    let bestText = '', bestScore = 0;
    for (let i = 0; i < event.results[0].length; i++) {
      const alt = event.results[0][i].transcript;
      const score = sentenceSimilarity(alt, expected);
      if (score > bestScore) { bestScore = score; bestText = alt; }
    }
    $('heard').textContent = '🗣 Duyduğum: "' + bestText + '"';
    evaluate(bestText, bestScore, expected);
  };

  rec.onerror = (e) => {
    state.listening = false;
    $('btnMic').classList.remove('listening');
    $('btnMic').textContent = '🎤 Mikrofonu Aç / Konuş';
    $('heard').classList.remove('listening');
    let m = 'Mikrofon hatası: ' + e.error;
    if (e.error === 'not-allowed') {
      m = '❌ <b>Mikrofon izni reddedildi.</b> Adres çubuğundaki simgeden izin verin ve sayfayı yenileyin.';
    } else if (e.error === 'no-speech') {
      m = '🔇 <b>Ses duyulmadı.</b> Düğmeye basıp hemen konuşun; çok sessiz olmayın.';
    } else if (e.error === 'network') {
      m = '🌐 <b>Ağ hatası.</b> Chrome\'un konuşma tanıma motoru internete ihtiyaç duyar. Bağlantınızı kontrol edin.';
    } else if (e.error === 'audio-capture') {
      m = '🎤 <b>Mikrofon yakalanamadı.</b> Başka bir uygulama mikrofonu kullanıyor olabilir.';
    } else if (e.error === 'aborted') {
      m = '⏹ Dinleme iptal edildi.';
    }
    $('msg').innerHTML = m;
    $('msg').className = 'no';
    $('micStatus').innerHTML = m;
    $('micStatus').className = 'bad';
  };

  rec.onend = () => {
    state.listening = false;
    $('btnMic').classList.remove('listening');
    if ($('btnMic').textContent.includes('Dinliyorum')) {
      $('btnMic').textContent = '🎤 Mikrofonu Aç / Konuş';
    }
    $('heard').classList.remove('listening');
  };

  state.recognition = rec;
}

/* ============================================================
   DEĞERLENDİRME
   ============================================================ */
function evaluate(said, score, expected) {
  const threshold = 0.75;
  if (score >= threshold) {
    if (!state.answered) {
      state.answered = true;
      state.stars = Math.min(5, state.stars + 1);
      updateStars();
      bumpStars();
    }
    $('msg').textContent = '✅ Doğru! Benzerlik: %' + Math.round(score * 100) + ' — +1 yıldız ⭐';
    $('msg').className = 'ok';
    $('enHint').textContent = expected;
    $('enHint').classList.add('show');
    speakEnglish(expected);
  } else {
    shakeStars();
    $('msg').textContent = '❌ Yanlış. Benzerlik: %' + Math.round(score * 100) +
      ' — Doğru cevap: "' + expected + '"';
    $('msg').className = 'no';
    $('enHint').textContent = 'İpucu: ' + expected;
    $('enHint').classList.add('show');
  }
}

/* ============================================================
   SESLENDİRME
   ============================================================ */
function speakEnglish(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1.1;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => /^en[-_]US/i.test(v.lang)) ||
                  voices.find(v => /^en[-_]/i.test(v.lang));
  if (enVoice) u.voice = enVoice;
  window.speechSynthesis.speak(u);
}

/* ============================================================
   EKRANI ÇİZ
   ============================================================ */
function render() {
  const item = POOL[state.idx];
  $('trLine').textContent = item.tr;
  $('enHint').textContent = '';
  $('enHint').classList.remove('show');
  $('heard').textContent = 'Henüz dinlenmedi.';
  $('heard').classList.remove('listening');
  $('msg').textContent = '';
  $('msg').className = '';
  $('btnMic').textContent = '🎤 Mikrofonu Aç / Konuş';
  $('btnMic').classList.remove('listening');
  $('btnMic').disabled = false;

  $('prog').textContent = 'Soru: ' + (state.idx + 1) + ' / ' + TOTAL;
  $('remain').textContent = 'Kalan: ' + (TOTAL - state.idx);
  state.answered = false;
}

/* ============================================================
   DÜĞMELER
   ============================================================ */
$('btnMic').addEventListener('click', () => {
  if (state.listening) {
    state.recognition && state.recognition.stop();
    return;
  }
  if (!state.recognition) {
    $('msg').textContent = 'Konuşma tanıma desteklenmiyor.';
    $('msg').className = 'no';
    return;
  }
  requestMicAndStart();
});

$('btnSpeak').addEventListener('click', () => {
  speakEnglish(POOL[state.idx].en);
  $('msg').textContent = '🔊 Doğru cevap dinleniyor…';
  $('msg').className = '';
});

$('btnSkip').addEventListener('click', () => {
  if (state.recognition && state.listening) state.recognition.stop();
  window.speechSynthesis && window.speechSynthesis.cancel();
  state.idx = (state.idx + 1) % TOTAL;
  if (state.idx === 0) {
    state.stars = 0;
    updateStars();
    $('msg').textContent = '🔄 Yeni tur başladı!';
    $('msg').className = '';
  }
  render();
});

/* ============================================================
   BAŞLAT
   ============================================================ */
window.speechSynthesis && window.speechSynthesis.getVoices();
const envOk = checkEnvironment();
initRecognition();
render();
updateStars();
</script>
</body>
</html>
