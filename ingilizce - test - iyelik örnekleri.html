.cnt,.hint{text-align:center;color:var(--sub);font-weight:700;font-size:.9rem}
.card{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--bar);display:flex;flex-direction:column;gap:10px}
svg{width:100%;height:auto;max-height:260px;border-radius:16px;display:block}
.q{font-size:1.5rem;font-weight:800;line-height:1.6}

@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink2);font-size:1.05rem}

button.alt{background:#7c6cf0;box-shadow:0 5px 0 #5a4bc9}
button.ok{background:#35b97a;box-shadow:0 5px 0 #218a58}
#next{flex:1;font-size:1.3rem;padding:14px}
#prev{background:#b9a9d6;box-shadow:0 5px 0 #8f7fb2}
