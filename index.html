<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depo Sayfam</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f6f8fa;
    color: #24292f;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #57606a; font-size: 0.9rem; margin-bottom: 24px; }
  #loading { color: #57606a; font-style: italic; }
  #error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; }

  /* Ağaç konteyner */
  .tree-node {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  /* Açılır düğme */
  .node-btn {
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 600;
    background: #f6f8fa;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #24292f;
    transition: background 0.15s;
    gap: 10px;
  }
  .node-btn:hover { background: #eaeef2; }
  .node-btn .arrow {
    transition: transform 0.2s;
    font-size: 0.8rem;
    color: #57606a;
    flex-shrink: 0;
  }
  .node-btn.open .arrow { transform: rotate(90deg); }
  .node-btn .count {
    font-weight: 400;
    font-size: 0.8rem;
    color: #57606a;
    margin-left: 8px;
  }

  /* İçerik alanı (çocuklar) */
  .node-children {
    display: none;
    padding: 8px 8px 10px 20px;
    border-top: 1px solid #d0d7de;
    background: #fbfcfd;
  }
  .node-children.open { display: block; }

  /* İç içe düğmeler daha küçük ve farklı renkli */
  .node-children .node-btn {
    font-size: 0.94rem;
    font-weight: 500;
    padding: 10px 14px;
    background: #fff;
  }
  .node-children .node-btn:hover { background: #eaeef2; }

  /* Dosya linkleri */
  .file-link {
    display: block;
    padding: 9px 14px;
    margin: 4px 0;
    color: #0969da;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.9rem;
    border-left: 3px solid #0969da;
    background: #ddf4ff;
    transition: background 0.15s;
  }
  .file-link:hover { background: #b6e3ff; }
  .file-link .ext { color: #57606a; font-size: 0.82rem; font-weight: 400; }
</style>
</head>
<body>

<h1>📁 Depo Sayfam</h1>
<p class="subtitle">Dosya adları <code>İsim1-İsim2-İsim3...html</code> formatına göre iç içe gruplanmıştır.</p>

<div id="loading">Dosyalar yükleniyor...</div>
<div id="error"></div>
<div id="tree"></div>

<script>
(async function () {
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const treeEl = document.getElementById('tree');

  function getRepoInfo() {
    const host = window.location.hostname;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const user = host.replace('.github.io', '');
      const repo = pathParts.length > 0 ? pathParts[0] : `${user}.github.io`;
      return { user, repo };
    }
    return null;
  }

  const repoInfo = getRepoInfo();
  let files = [];

  if (repoInfo) {
    try {
      const apiUrl = `https://api.github.com/repos/${repoInfo.user}/${repoInfo.repo}/contents/`;
      const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (res.ok) {
        const data = await res.json();
        files = data
          .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.html'))
          .map(item => item.name);
      }
    } catch (e) {
      console.warn('API denemesi başarısız:', e);
    }
  }

  // Local test için manuel liste:
  // files = ["Matematik-Türev.html", "Matematik-İntegral-Kolay.html", "Fizik-Kuvvet.html"];

  loadingEl.style.display = 'none';

  if (files.length === 0) {
    errorEl.style.display = 'block';
    errorEl.innerHTML =
      '⚠️ Dosya listesi alınamadı. GitHub Pages üzerinde otomatik listeler. ' +
      'Local test için <code>files</code> dizisine dosya adlarını manuel ekleyebilirsin.';
    return;
  }

  // index.html'i listeden çıkar
  files = files.filter(f => f.toLowerCase() !== 'index.html');

  // Ağaç yapısını kur
  // Her node: { name, children: Map, files: [dosyaAdları] }
  const root = { name: null, children: new Map(), files: [] };

  files.forEach(fname => {
    const nameNoExt = fname.replace(/\.html?$/i, '');
    const parts = nameNoExt.split('-').filter(p => p.length > 0);
    if (parts.length === 0) return;

    let node = root;
    parts.forEach(part => {
      if (!node.children.has(part)) {
        node.children.set(part, { name: part, children: new Map(), files: [] });
      }
      node = node.children.get(part);
    });
    // Yaprak node'a dosyayı ekle
    node.files.push(fname);
  });

  // Ağacı render et
  renderChildren(root, treeEl, 0);

  function renderChildren(parentNode, container, depth) {
    // Önce çocuk node'ları (düğmeler) alfabetik sırala
    const childNames = [...parentNode.children.keys()].sort((a, b) => a.localeCompare(b, 'tr'));

    childNames.forEach(name => {
      const childNode = parentNode.children.get(name);

      // Düğme için toplam dosya sayısını hesapla (tüm alt ağaçtaki)
      const totalFiles = countFiles(childNode);

      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'tree-node';

      const btn = document.createElement('button');
      btn.className = 'node-btn';
      btn.innerHTML = `
        <span style="display:flex; align-items:center;">
          <span class="arrow">▶</span>
          <span>${escapeHtml(name)}</span>
          <span class="count">(${totalFiles})</span>
        </span>
      `;

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'node-children';

      btn.addEventListener('click', () => {
        btn.classList.toggle('open');
        childrenDiv.classList.toggle('open');
      });

      // Bu node'un kendi dosyaları varsa (yani bu isimli html dosyası)
      // ve alt node'ları varsa, ikisini de childrenDiv içine koy
      renderChildren(childNode, childrenDiv, depth + 1);

      // Bu node'un doğrudan dosyaları (bu isimde bir html dosyası varsa)
      childNode.files.sort((a, b) => a.localeCompare(b, 'tr'));
      childNode.files.forEach(fname => {
        const link = document.createElement('a');
        link.className = 'file-link';
        link.href = encodeURI(fname);
        link.innerHTML = `📄 ${escapeHtml(fname)}`;
        childrenDiv.appendChild(link);
      });

      // Eğer childNode'un hiç içeriği yoksa (olmamalı ama güvenlik), düğme yine de çalışsın
      nodeDiv.appendChild(btn);
      nodeDiv.appendChild(childrenDiv);
      container.appendChild(nodeDiv);
    });
  }

  function countFiles(node) {
    let n = node.files.length;
    node.children.forEach(c => { n += countFiles(c); });
    return n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>

</body>
</html>
