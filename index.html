<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f6f8fa;
    color: #24292f;
  }
  #loading { color: #57606a; font-style: italic; }
  #error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; }

  /* Ağaç konteyner */
  .tree-node {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .node-btn {
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 600;
    background: #f6f8fa;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #24292f;
    transition: background 0.15s;
    gap: 10px;
  }
  .node-btn:hover { background: #eaeef2; }
  .node-btn .arrow {
    transition: transform 0.2s;
    font-size: 0.8rem;
    color: #57606a;
    flex-shrink: 0;
  }
  .node-btn.open .arrow { transform: rotate(90deg); }
  .node-btn .count {
    font-weight: 400;
    font-size: 0.8rem;
    color: #57606a;
    margin-left: 8px;
  }

  /* Yaprak düğme (doğrudan dosya açan) */
  .node-btn.leaf { color: #0969da; }
  .node-btn.leaf .arrow { visibility: hidden; }
  .node-btn.leaf::after {
    content: "↗";
    font-size: 0.95rem;
    color: #0969da;
    margin-left: 8px;
    font-weight: 600;
  }

  .node-children {
    display: none;
    padding: 8px 8px 10px 20px;
    border-top: 1px solid #d0d7de;
    background: #fbfcfd;
  }
  .node-children.open { display: block; }

  .node-children .node-btn {
    font-size: 0.94rem;
    font-weight: 500;
    padding: 10px 14px;
    background: #fff;
  }

  .file-link {
    display: block;
    padding: 9px 14px;
    margin: 4px 0;
    color: #0969da;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.9rem;
    border-left: 3px solid #0969da;
    background: #ddf4ff;
    transition: background 0.15s;
  }
  .file-link:hover { background: #b6e3ff; }

  /* ==== Görüntüleyici (iframe) ==== */
  #viewer { display: none; }
  #viewer.active { display: block; }

  .viewer-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  /* ==== Geri: düğme değil, sol ok + "Geri" yazılı bağlantı ==== */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding-right: 10px;
    color: #0969da;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .back-link svg {
    width: 30px;
    height: 30px;
    transition: transform .2s ease;
  }
  .back-link:hover svg,
  .back-link:focus-visible svg { transform: translateX(-4px); }
  .back-link:active svg { transform: translateX(-8px); }
  .back-link:focus-visible { outline: 2px dashed #0969da; outline-offset: 2px; border-radius: 6px; }

  .viewer-title {
    color: #57606a;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .viewer-frame {
    width: 100%;
    height: calc(100vh - 120px);
    min-height: 400px;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    background: #fff;
    display: block;
  }
</style>
</head>
<body>

<div id="loading">Dosyalar yükleniyor...</div>
<div id="error"></div>
<div id="tree"></div>

<!-- İçerik görüntüleyici -->
<div id="viewer">
  <div class="viewer-bar">
    <a href="#" class="back-link" id="backLink" aria-label="Geri">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12H4M11 5l-7 7 7 7"/>
      </svg>
      <span>Geri</span>
    </a>
    <span class="viewer-title" id="viewerTitle"></span>
  </div>
  <iframe id="viewerFrame" class="viewer-frame" title="Dosya içeriği"></iframe>
</div>

<script>
(async function () {
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const treeEl = document.getElementById('tree');
  const viewerEl = document.getElementById('viewer');
  const viewerFrame = document.getElementById('viewerFrame');
  const viewerTitle = document.getElementById('viewerTitle');
  const backLink = document.getElementById('backLink');

  function getRepoInfo() {
    const host = window.location.hostname;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const user = host.replace('.github.io', '');
      const repo = pathParts.length > 0 ? pathParts[0] : `${user}.github.io`;
      return { user, repo };
    }
    return null;
  }

  const repoInfo = getRepoInfo();
  let files = [];
  let apiError = null;

  if (repoInfo) {
    try {
      const apiUrl = `https://api.github.com/repos/${repoInfo.user}/${repoInfo.repo}/contents/`;
      const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (res.ok) {
        const data = await res.json();
        files = data
          .filter(item => item.type === 'file' && /\.html?$/i.test(item.name))
          .map(item => item.name);
      } else {
        apiError = `GitHub API yanıtı: ${res.status} ${res.statusText}`;
        console.warn(apiError);
      }
    } catch (e) {
      apiError = 'API isteği başarısız: ' + e.message;
      console.warn(apiError, e);
    }
  }

  loadingEl.style.display = 'none';

  files = files.filter(f => f.toLowerCase() !== 'index.html');

  if (files.length === 0) {
    errorEl.style.display = 'block';
    errorEl.textContent = repoInfo
      ? 'Bu depoda listelenecek HTML dosyası bulunamadı.' + (apiError ? ' (' + apiError + ')' : '')
      : 'GitHub Pages ortamı algılanamadı. Dosya listesi alınamadı.';
    return;
  }

  // Ağaç yapısını kur
  const root = { children: new Map(), files: [] };

  files.forEach(fname => {
    const parts = fname.replace(/\.html?$/i, '').split('-').filter(p => p.length > 0);
    if (parts.length === 0) return;

    let node = root;
    parts.forEach(part => {
      if (!node.children.has(part)) {
        node.children.set(part, { children: new Map(), files: [] });
      }
      node = node.children.get(part);
    });
    node.files.push(fname);
  });

  renderChildren(root, treeEl);

  // ==== Görüntüleyici kontrolleri ====
  let savedScroll = 0;

  function openViewer(fname, push = true) {
    if (!viewerEl.classList.contains('active')) savedScroll = window.scrollY;
    viewerFrame.src = safeHref(fname);
    viewerTitle.textContent = fname;
    treeEl.style.display = 'none';
    viewerEl.classList.add('active');
    // URL hash → tarayıcı geri tuşu desteği
    if (push) history.pushState({ file: fname }, '', '#' + encodeURIComponent(fname));
    window.scrollTo(0, 0);
  }

  function closeViewer() {
    viewerFrame.src = 'about:blank';
    viewerTitle.textContent = '';
    viewerEl.classList.remove('active');
    treeEl.style.display = '';
    // Liste, açık düğümleriyle birlikte kaldığı yerde görünür
    window.scrollTo(0, savedScroll);
  }

  // Geri: tarayıcı geçmişine bağlı olmadan HER durumda listeye döner
  backLink.addEventListener('click', (ev) => {
    ev.preventDefault();
    closeViewer();
    try {
      history.replaceState({}, '', window.location.pathname + window.location.search);
    } catch (_) {}
  });

  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.file) {
      openViewer(e.state.file, false);
    } else {
      closeViewer();
    }
  });

  // Sayfa hash ile açıldıysa dosyayı göster
  if (window.location.hash.length > 1) {
    try {
      const fname = decodeURIComponent(window.location.hash.slice(1));
      if (files.includes(fname)) {
        history.replaceState({ file: fname }, '', '#' + encodeURIComponent(fname));
        openViewer(fname, false);
      }
    } catch (_) {}
  }

  // ==== Ağaç render ====
  function renderChildren(parentNode, container) {
    const childNames = [...parentNode.children.keys()].sort((a, b) => a.localeCompare(b, 'tr'));

    childNames.forEach(name => {
      const childNode = parentNode.children.get(name);
      const isLeaf = childNode.children.size === 0 && childNode.files.length > 0;
      const directFile = isLeaf ? childNode.files[0] : null;

      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'tree-node';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'node-btn' + (directFile ? ' leaf' : '');
      btn.setAttribute('aria-expanded', 'false');

      btn.innerHTML =
        '<span style="display:flex; align-items:center; gap:6px;">' +
          '<span class="arrow" aria-hidden="true">▶</span>' +
          '<span>' + escapeHtml(name) + '</span>' +
          '<span class="count">(' + countFiles(childNode) + ')</span>' +
        '</span>';

      nodeDiv.appendChild(btn);

      if (directFile) {
        // YAPRAK: tıklayınca dosyayı GÖRÜNTÜLEYİCİDE aç
        btn.addEventListener('click', () => openViewer(directFile));
      } else {
        // ARA DÜĞÜM: aç/kapat
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'node-children';
        childrenDiv.id = 'children-' + Math.random().toString(36).slice(2, 10);
        btn.setAttribute('aria-controls', childrenDiv.id);

        btn.addEventListener('click', () => {
          const open = btn.classList.toggle('open');
          childrenDiv.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(open));
        });

        renderChildren(childNode, childrenDiv);

        childNode.files.sort((a, b) => a.localeCompare(b, 'tr'));
        childNode.files.forEach(fname => {
          const link = document.createElement('a');
          link.className = 'file-link';
          link.href = safeHref(fname);
          link.textContent = '📄 ' + fname;
          link.addEventListener('click', (ev) => {
            ev.preventDefault();
            openViewer(fname);
          });
          childrenDiv.appendChild(link);
        });

        nodeDiv.appendChild(childrenDiv);
      }

      container.appendChild(nodeDiv);
    });
  }

  function safeHref(fname) {
    return fname.split('/').map(encodeURIComponent).join('/');
  }

  function countFiles(node) {
    let n = node.files.length;
    node.children.forEach(c => { n += countFiles(c); });
    return n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>

</body>
</html>
