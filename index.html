<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depo Sayfam</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f6f8fa;
    color: #24292f;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #57606a; font-size: 0.9rem; margin-bottom: 24px; }
  #loading { color: #57606a; font-style: italic; }
  #error { color: #cf222e; background: #ffebe9; padding: 12px; border-radius: 6px; display: none; }

  .tree-node {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .node-btn {
    width: 100%;
    text-align: left;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 600;
    background: #f6f8fa;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #24292f;
    transition: background 0.15s;
    gap: 10px;
  }
  .node-btn:hover { background: #eaeef2; }
  .node-btn .arrow {
    transition: transform 0.2s;
    font-size: 0.8rem;
    color: #57606a;
    flex-shrink: 0;
  }
  .node-btn.open .arrow { transform: rotate(90deg); }
  .node-btn .count {
    font-weight: 400;
    font-size: 0.8rem;
    color: #57606a;
    margin-left: 8px;
  }

  /* Yaprak düğme (doğrudan dosya açan) */
  .node-btn.leaf {
    cursor: pointer;
    color: #0969da;
  }
  .node-btn.leaf .arrow {
    visibility: hidden; /* ok yok, dosya gibi davranır */
  }
  .node-btn.leaf::after {
    content: "↗";
    font-size: 0.95rem;
    color: #0969da;
    margin-left: 8px;
    font-weight: 600;
  }

  .node-children {
    display: none;
    padding: 8px 8px 10px 20px;
    border-top: 1px solid #d0d7de;
    background: #fbfcfd;
  }
  .node-children.open { display: block; }

  .node-children .node-btn {
    font-size: 0.94rem;
    font-weight: 500;
    padding: 10px 14px;
    background: #fff;
  }
  .node-children .node-btn:hover { background: #eaeef2; }

  .file-link {
    display: block;
    padding: 9px 14px;
    margin: 4px 0;
    color: #0969da;
    text-decoration: none;
    border-radius: 6px;
    font-size: 0.9rem;
    border-left: 3px solid #0969da;
    background: #ddf4ff;
    transition: background 0.15s;
  }
  .file-link:hover { background: #b6e3ff; }
</style>
</head>
<body>

<h1>📁 Depo Sayfam</h1>
<p class="subtitle">Dosya adları <code>İsim1-İsim2-İsim3...html</code> formatına göre iç içe gruplanmıştır. Son <code>-</code> sonrası düğmeler doğrudan dosyayı açar.</p>

<div id="loading">Dosyalar yükleniyor...</div>
<div id="error"></div>
<div id="tree"></div>

<script>
(async function () {
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const treeEl = document.getElementById('tree');

  function getRepoInfo() {
    const host = window.location.hostname;
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    if (host.endsWith('.github.io')) {
      const user = host.replace('.github.io', '');
      const repo = pathParts.length > 0 ? pathParts[0] : `${user}.github.io`;
      return { user, repo };
    }
    return null;
  }

  const repoInfo = getRepoInfo();
  let files = [];
  let apiError = null;

  if (repoInfo) {
    try {
      const apiUrl = `https://api.github.com/repos/${repoInfo.user}/${repoInfo.repo}/contents/`;
      const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (res.ok) {
        const data = await res.json();
        files = data
          .filter(item => item.type === 'file' && /\.html?$/i.test(item.name))
          .map(item => item.name);
      } else {
        apiError = `GitHub API yanıtı: ${res.status} ${res.statusText}`;
        console.warn(apiError);
      }
    } catch (e) {
      apiError = 'API isteği başarısız: ' + e.message;
      console.warn(apiError, e);
    }
  }

  // Local test için manuel liste:
  // files = ["Matematik-Türev.html", "Matematik-İntegral-Kolay.html", "Fizik-Kuvvet.html"];

  loadingEl.style.display = 'none';

  // index.html'i ÖNCE çıkar
  files = (files || []).filter(f => f.toLowerCase() !== 'index.html');

  if (files.length === 0) {
    errorEl.style.display = 'block';
    errorEl.textContent = repoInfo
      ? 'Bu depoda listelenecek HTML dosyası bulunamadı.' + (apiError ? ' (' + apiError + ')' : '')
      : 'GitHub Pages ortamı algılanamadı. Dosya listesi alınamadı.';
    return;
  }

  // Ağaç yapısını kur
  const root = { name: null, children: new Map(), files: [] };

  files.forEach(fname => {
    const nameNoExt = fname.replace(/\.html?$/i, '');
    const parts = nameNoExt.split('-').filter(p => p.length > 0);
    if (parts.length === 0) return;

    let node = root;
    parts.forEach(part => {
      if (!node.children.has(part)) {
        node.children.set(part, { name: part, children: new Map(), files: [] });
      }
      node = node.children.get(part);
    });
    node.files.push(fname);
  });

  renderChildren(root, treeEl, 0);

  function renderChildren(parentNode, container, depth) {
    const childNames = [...parentNode.children.keys()].sort((a, b) => a.localeCompare(b, 'tr'));

    childNames.forEach(name => {
      const childNode = parentNode.children.get(name);

      // Yaprak mı? (alt düğümü yok)
      const isLeaf = childNode.children.size === 0 && childNode.files.length > 0;

      // Yapraksa ve tek dosyası varsa → doğrudan o dosyaya git
      // Yapraksa ama birden fazla dosya varsa (olmamalı, çünkü aynı ada tek dosya düşer) → ilkini aç
      const directFile = isLeaf ? childNode.files[0] : null;

      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'tree-node';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'node-btn' + (directFile ? ' leaf' : '');

      const totalFiles = countFiles(childNode);

      btn.innerHTML =
        '<span style="display:flex; align-items:center; gap:6px;">' +
          '<span class="arrow" aria-hidden="true">▶</span>' +
          '<span>' + escapeHtml(name) + '</span>' +
          '<span class="count">(' + totalFiles + ')</span>' +
        '</span>';

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'node-children';

      const childrenId = 'children-' + Math.random().toString(36).slice(2, 10);
      childrenDiv.id = childrenId;
      btn.setAttribute('aria-controls', childrenId);

      if (directFile) {
        // YAPRAK: tıklayınca dosyayı aç
        btn.setAttribute('aria-expanded', 'false'); // açılır değil, sadece link
        btn.addEventListener('click', () => {
          window.location.href = safeHref(directFile);
        });
      } else {
        // ARA DÜĞÜM: aç/kapat
        btn.setAttribute('aria-expanded', 'false');
        btn.addEventListener('click', () => {
          const open = btn.classList.toggle('open');
          childrenDiv.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(open));
        });
      }

      nodeDiv.appendChild(btn);

      // Yaprak düğmeler için childrenDiv içine link koymuyoruz — düğme zaten dosyayı açıyor.
      // Ama bir düğümün HEM kendi dosyası HEM alt düğümleri varsa (nadir),
      // düğme aç/kapat olur; kendi dosyası içeride link olarak görünür.
      if (!directFile) {
        renderChildren(childNode, childrenDiv, depth + 1);

        childNode.files.sort((a, b) => a.localeCompare(b, 'tr'));
        childNode.files.forEach(fname => {
          const link = document.createElement('a');
          link.className = 'file-link';
          link.href = safeHref(fname);
          link.textContent = '📄 ' + fname;
          childrenDiv.appendChild(link);
        });

        nodeDiv.appendChild(childrenDiv);
      }

      container.appendChild(nodeDiv);
    });
  }

  function safeHref(fname) {
    return fname.split('/').map(encodeURIComponent).join('/');
  }

  function countFiles(node) {
    let n = node.files.length;
    node.children.forEach(c => { n += countFiles(c); });
    return n;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
})();
</script>

</body>
</html>
