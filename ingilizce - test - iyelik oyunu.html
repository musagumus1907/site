<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whose Is It? Word Puzzle</title>
<style>
:root{--bg:#f1eeff;--card:#fff;--ink:#23304a;--mut:#4d5772;--btn:#5b4bd6;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a2b;--card:#232842;--ink:#f1f3fb;--mut:#b8bfd8;--btn:#9d92ff;--btnt:#15172a}}
:root[data-theme="dark"]{--bg:#171a2b;--card:#232842;--ink:#f1f3fb;--mut:#b8bfd8;--btn:#9d92ff;--btnt:#15172a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;min-height:100%;padding:12px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:1.25rem;margin:0}
#prog{color:var(--mut);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 3px 0 rgba(80,70,160,.18)}
#q{font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:800;margin:0 0 8px;line-height:1.25}
#scene{display:block;width:100%;height:auto;max-height:42vh;border-radius:16px}
#slots,#pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
#pool{min-height:64px;padding-top:6px}
.lbl{margin:16px 0 0;font-weight:700;color:var(--mut);text-align:center}
.c-b{--f:#cfe3ff;--b:#4f86e0}.c-g{--f:#dfe2e8;--b:#7b8494}.c-p{--f:#cfeed2;--b:#4d9d57}.c-n{--f:#ffd3d1;--b:#dd6563}
.slot,.tok{min-width:64px;min-height:56px;padding:8px 14px;border-radius:16px;border:3px solid var(--b);font:inherit;font-size:clamp(1.1rem,3.8vw,1.5rem);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.slot{border-style:dashed;color:#23304a;background:transparent;position:relative}
.slot .n{font-size:.8rem;color:var(--mut);font-weight:700}
.slot.on{border-style:solid;background:var(--f);animation:pop .35s}
.slot.act{box-shadow:0 0 0 4px var(--btn)}
.tok{background:var(--f);color:#23304a;cursor:pointer;box-shadow:0 4px 0 var(--b)}
.tok:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b)}
:focus-visible{outline:4px solid var(--btn);outline-offset:3px}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:none}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button.act{font:inherit;font-weight:800;font-size:1.15rem;padding:12px 22px;border-radius:999px;border:0;background:var(--btn);color:var(--btnt);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button.alt{background:transparent;color:var(--ink);border:3px solid var(--btn);box-shadow:none}
#msg{text-align:center;font-weight:800;min-height:1.6em;margin:10px 0 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:.85rem;font-weight:700}
.legend span{padding:3px 10px;border-radius:999px;border:2px solid var(--b);background:var(--f);color:#23304a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.shake{outline:4px solid #dd6563}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="status" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
<main role="main" aria-label="Whose is it? English word puzzle">
  <header>
    <h1>Whose is it? Word puzzle</h1>
    <div id="prog" aria-live="polite"></div>
  </header>
  <div class="card" role="application" aria-label="Word puzzle game area">
    <p id="q" tabindex="-1" aria-live="polite" aria-label="Question"></p>
    <svg id="scene" viewBox="0 0 400 230" role="img"></svg>
    <p class="lbl" id="l1">Build the answer:</p>
    <div id="slots" role="list" aria-label="Answer slots" aria-live="polite"></div>
    <p class="lbl" id="l2">Word bank:</p>
    <div id="pool" role="group" aria-label="Word bank" aria-live="polite"></div>
    <p id="msg" role="status" aria-live="polite"></p>
    <div class="row">
      <button class="act alt" id="hear" type="button">Hear the question</button>
      <button class="act" id="next" type="button" hidden>Next question</button>
    </div>
    <div class="legend" aria-hidden="true">
      <span class="c-b">This, It, Yes</span><span class="c-g">is, are</span><span class="c-p">my, your, father’s</span><span class="c-n">nouns, places</span>
    </div>
  </div>
</main>
<script>
const D=[
["Is this my blue pencil on the desk?","Yes,|this|is|your|blue pencil."],
["Is this my book in your hand?","Yes,|that|is|your|book."],
["Is this my jacket hanging on the wall?","Yes,|that|is|your|jacket|hanging on the wall."],
["Whose cup is this in my hand?","It|is|the|daughter's|cup."],
["Is this my coffee cup on the counter?","No,|that|is|my|coffee cup."],
["Are these my keys on the table?","Yes,|these|are|your|keys|on the table."],
["Is this my phone next to you?","No,|this|is|my|phone."],
["Whose keys are these on the table?","These|are|the|father's|keys."],
["Is this my hat on the chair?","Yes,|this|is|your|hat."],
["Is this my spoon on the plate?","Yes,|that|is|your|spoon."],
["Are these my socks on the floor?","No,|these|are|your|socks."],
["Whose book is this on the sofa?","It|is|the|father's|book."],
["Is this my comb next to the mirror?","Yes,|this|is|your|comb."],
["Is this your bicycle by the door?","Yes,|this|is|my|bicycle."],
["Is this your glasses on the book?","Yes,|this|is|my|glasses."],
["Whose shoes are these on the rug?","They|are|the|father's|shoes."],
["Is that your car in the garage?","No,|that|is|his|car."],
["Is this your classroom down the hall?","Yes,|this|is|our|classroom|down the hall."],
["Is this your bag under the table?","Yes,|this|is|my|bag."],
["Whose backpack is this by the door?","It|is|Tom's|backpack."],
["Are these your shoes on the rug?","Yes,|these|are|my|shoes."],
["Is this your pen in the box?","Yes,|that|is|my|pen."],
["Is this your water bottle on the table?","Yes,|this|is|my|water bottle."],
["Whose cat is sleeping on the chair?","It|is|the|family's|cat."],
["Is that your pillow on the bed?","No,|that|is|my|pillow."],
["Are these your toys in the basket?","Yes,|these|are|my|toys."],
["Is this his coat on the hanger?","Yes,|this|is|his|coat."],
["Whose computer is on the table?","It|is|the|teacher's|computer."],
["Is this his laptop on the desk?","Yes,|this|is|his|laptop|on the desk."],
["Is that his dog barking in the garden?","Yes,|that|is|his|dog."],
["Is this his wallet on the bench?","Yes,|this|is|his|wallet."],
["Whose toys are on the floor?","They|are|the|children's|toys."],
["Is this his workspace on the screen?","Yes,|this|is|his|workspace."],
["Are these his letters on the table?","No,|they|are|my|letters."],
["Is this his umbrella behind the door?","Yes,|this|is|his|umbrella."],
["Whose house is down the street?","It|is|the|neighbors'|house."],
["Is this his watch on the shelf?","Yes,|this|is|his|watch."],
["Is that his t-shirt on the chair?","No,|that|is|my|t-shirt."],
["Are these his slippers by the bed?","Yes,|these|are|his|slippers."],
["Whose jacket is hanging on the wall?","It|is|Mary's|jacket."],
["Is this her dress in the closet?","Yes,|this|is|her|dress."],
["Is this her house next to the park?","Yes,|this|is|her|house."],
["Is that her cat sleeping on the chair?","Yes,|that|is|her|cat."],
["Whose ball is in the garden?","It|is|the|dog's|ball."],
["Is this her homework on the table?","Yes,|this|is|her|homework."],
["Is this her document on the coffee table?","No,|this|is|your|document."],
["Are these her keys in your hand?","Yes,|these|are|her|keys."],
["Whose cars are in the garage?","They|are|our|parents'|cars."],
["Is this her ring in the box?","Yes,|this|is|her|ring."],
["Is this her notebook on the desk?","Yes,|this|is|her|notebook."],
["Is that her mirror on the wall?","No,|that|is|my|mirror."],
["Whose letters are on the counter?","They|are|the|manager's|letters."],
["Are these her drawings on the fridge?","Yes,|these|are|her|drawings."],
["Is this its water bowl next to the doghouse?","Yes,|this|is|its|water bottle."],
["Is that its toy in the cage?","Yes,|that|is|its|toy."],
["Whose hat is this on the chair?","It|is|mine."],
["Is this its collar on the floor?","Yes,|this|is|its|collar."],
["Is that its tail behind the curtain?","Yes,|that|is|its|tail."],
["Is this new toy its ball?","No,|it|is|my|ball."],
["Whose pencil is this on the table?","This|is|the|father's|pencil."],
["Is this its box in the garage?","Yes,|this|is|its|box|in the garage."],
["Is that its leash on the wall?","Yes,|this|is|its|leash."],
["Is this its blanket on the sofa?","Yes,|this|is|its|blanket."],
["Whose computer is this on the table?","It|is|the|teacher's|computer."],
["Is that its food in the bowl?","Yes,|that|is|its|food."]
];
const Q=D.map(([q,a])=>({q,a:a.split('|')}));
const $=id=>document.getElementById(id);
const fmt=s=>s.replace(/'/g,'’');
function cat(w){const l=w.toLowerCase().replace(/[.,]/g,'');
  if(/^(yes|no|this|that|these|those|it|they)$/.test(l))return'b';
  if(/^(is|are)$/.test(l))return'g';
  if(/^(my|your|his|her|its|our|mine|the)$/.test(l)||/'s$|s'$/.test(l))return'p';
  return'n';}
const CN={b:'subject',g:'verb',p:'possessive',n:'noun or place'};
let qi=0,filled=[],pool=[],done=false;
const say=t=>{const s=$('status');s.textContent='';setTimeout(()=>s.textContent=t,40)};
function shuffle(a){const o=a.slice();do{for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}}while(o.length>1&&o.join()===a.join());return o}

/* ---------- illustration ---------- */
function info(q,a){
  let item='';for(let k=a.length-1;k>=0;k--){if(cat(a[k])==='n'&&!/^(on|in|by|down|hanging)/.test(a[k])){item=a[k].replace(/[.,]/g,'');break}}
  if(!item){const m=q.match(/^Whose (\w+)/);item=m?m[1]:'thing'}
  const m=q.replace(/\?$/,'').match(/\b((?:hanging on|sleeping on|barking in|next to|on|in|by|under|behind|down)\s.*)$/i);
  const loc=m?m[1]:'';const l=loc.toLowerCase();
  let t='surf';
  if(/wall/.test(l))t='wall';else if(/floor|rug/.test(l))t='floor';else if(/door/.test(l))t='door';
  else if(/hand/.test(l))t='hand';else if(/garden|park|street|hall|garage|doghouse/.test(l))t='out';
  else if(/box|basket|cage|bowl|closet|fridge|hanger/.test(l))t='box';
  return{item,loc,t};
}
function blob(cx,by,name){
  let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360;
  const f=`hsl(${h},75%,80%)`,s=`hsl(${h},55%,45%)`,y=by-58;
  return `<g><rect x="${cx-38}" y="${y}" width="76" height="58" rx="20" fill="${f}" stroke="${s}" stroke-width="3"/>
  <circle cx="${cx-14}" cy="${y+22}" r="5" fill="#23304a"/><circle cx="${cx+14}" cy="${y+22}" r="5" fill="#23304a"/>
  <circle cx="${cx-24}" cy="${y+34}" r="5" fill="#ff9aa8" opacity=".7"/><circle cx="${cx+24}" cy="${y+34}" r="5" fill="#ff9aa8" opacity=".7"/>
  <path d="M${cx-8} ${y+34}q8 9 16 0" fill="none" stroke="#23304a" stroke-width="3" stroke-linecap="round"/>
  <text x="${cx}" y="${y-8}" text-anchor="middle" font-size="16" font-weight="800" fill="#23304a">${name}</text></g>`;
}
function scene(q,a){
  const{item,loc,t}=info(q,a);let b='',it='';
  const room='<rect width="400" height="230" fill="#ffe9f1"/><rect y="165" width="400" height="65" fill="#f1d5a8"/>';
  if(t==='out'){b=`<rect width="400" height="230" fill="#c4e8ff"/><circle cx="340" cy="45" r="26" fill="#ffd95a"/><ellipse cx="90" cy="50" rx="40" ry="14" fill="#fff"/><ellipse cx="115" cy="42" rx="26" ry="14" fill="#fff"/><rect y="160" width="400" height="70" fill="#9bd67a"/>`;it=blob(200,170,item)}
  else if(t==='wall'){b=room+`<line x1="200" y1="10" x2="200" y2="62" stroke="#8a6a4a" stroke-width="3"/><circle cx="200" cy="10" r="5" fill="#8a6a4a"/>`;it=blob(200,150,item)}
  else if(t==='floor'){b=room+`<ellipse cx="200" cy="190" rx="130" ry="26" fill="#8ec5ff" stroke="#4f86e0" stroke-width="3"/>`;it=blob(200,190,item)}
  else if(t==='door'){b=room+`<rect x="262" y="20" width="100" height="190" rx="8" fill="#b9824f" stroke="#7a4f2a" stroke-width="3"/><circle cx="276" cy="120" r="7" fill="#ffd95a"/>`;it=blob(140,190,item)}
  else if(t==='hand'){b=room+`<ellipse cx="200" cy="200" rx="70" ry="26" fill="#ffcf9e" stroke="#d99a62" stroke-width="3"/>`+[-48,-24,0,24].map((d,i)=>`<ellipse cx="${200+d}" cy="${176-(i%3==1?6:0)}" rx="10" ry="20" fill="#ffcf9e" stroke="#d99a62" stroke-width="3"/>`).join('');it=blob(200,170,item)}
  else if(t==='box'){b=room;it=blob(200,150,item)+`<path d="M120 135h160l10 80H110z" fill="#d9a066" stroke="#9a6a38" stroke-width="3"/><rect x="120" y="135" width="160" height="14" fill="#c48a50"/>`}
  else{b=room+`<rect x="95" y="152" width="210" height="16" rx="6" fill="#c88a54" stroke="#8d5a2c" stroke-width="3"/><rect x="115" y="168" width="14" height="52" fill="#c88a54"/><rect x="271" y="168" width="14" height="52" fill="#c88a54"/>`;it=blob(200,152,item)}
  $('scene').setAttribute('aria-label',`Picture: ${item}${loc?', '+loc:''}`);
  $('scene').innerHTML=b+it+`<text x="200" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#23304a">${item}${loc?', '+loc:''}</text>`;
}

/* ---------- game ---------- */
function render(focus){
  const{q,a}=Q[qi];
  $('q').textContent=fmt(q);$('prog').textContent=`Question ${qi+1} of ${Q.length}`;
  const act=filled.findIndex(x=>!x);
  $('slots').innerHTML='';
  a.forEach((w,i)=>{
    const d=document.createElement('div');d.className=`slot c-${cat(w)}`+(filled[i]?' on':'')+(i===act?' act':'');
    d.setAttribute('role','listitem');d.dataset.i=i;
    d.setAttribute('aria-label',`Slot ${i+1} of ${a.length}: ${filled[i]?w:'empty'}`);
    d.innerHTML=filled[i]?fmt(w):`<span class="n">${i+1}</span>`;
    d.addEventListener('dragover',e=>e.preventDefault());
    d.addEventListener('drop',e=>{e.preventDefault();const k=+e.dataTransfer.getData('text/plain');if(!filled[i]&&pool[k]&&!pool[k].used)place(k,i)});
    $('slots').appendChild(d);
  });
  $('pool').innerHTML='';
  pool.forEach((p,k)=>{
    if(p.used)return;
    const b=document.createElement('button');b.type='button';b.className=`tok c-${cat(p.w)}`;b.tabIndex=0;b.draggable=true;
    b.textContent=fmt(p.w);b.setAttribute('aria-label',`${p.w}, ${CN[cat(p.w)]}`);b.dataset.k=k;
    b.addEventListener('click',()=>place(k,null,b));
    b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',k));
    $('pool').appendChild(b);
  });
  if(focus){const f=$('pool').querySelector('button');if(f)f.focus()}
}
function place(k,slot,el){
  if(done)return;
  const w=pool[k].w,a=Q[qi].a;
  const t=slot==null?filled.findIndex(x=>!x):slot;
  if(a[t]===w){
    pool[k].used=true;filled[t]=true;
    const left=filled.some(x=>!x);
    $('msg').textContent='';
    say(`Correct: '${w}' placed in slot ${t+1}.`+(left?` ${a.length-filled.filter(Boolean).length} words left.`:''));
    render(true);
    if(!left)win();
  }else{
    say(`Incorrect word, returned to pool. '${w}' does not go in slot ${t+1}. Try another word.`);
    $('msg').textContent='Not that one. Try another word!';
    const tk=el||$('pool').querySelector(`[data-k="${k}"]`);
    [tk,$('slots').children[t]].forEach(n=>{if(n){n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}});
    if(tk)tk.focus();
  }
}
function win(){
  done=true;const s=Q[qi].a.join(' ');
  $('msg').textContent='Great job! '+fmt(s);
  say(`Great job! The sentence is: ${s}`);
  confetti();speak(s);
  const n=$('next');n.hidden=false;
  n.textContent=qi===Q.length-1?'Play again':'Next question';
  n.focus();
}
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function start(){
  done=false;const a=Q[qi].a;filled=a.map(()=>false);
  pool=shuffle(a).map(w=>({w,used:false}));
  $('next').hidden=true;$('msg').textContent='';
  scene(Q[qi].q,a);render(false);
  say(`Question ${qi+1} of ${Q.length}. ${Q[qi].q} Build the answer with ${a.length} words.`);
  $('q').focus();
}
$('next').addEventListener('click',()=>{qi=(qi+1)%Q.length;start()});
$('hear').addEventListener('click',()=>speak(Q[qi].q));

/* ---------- confetti ---------- */
function confetti(){
  const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cols=['#4f86e0','#dd6563','#4d9d57','#ffd95a','#9d92ff','#ff9aa8'];
  const P=Array.from({length:calm?30:150},()=>({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*7+4,a:Math.random()*6,c:cols[Math.random()*6|0]}));
  let f=0;(function tick(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}
start();
</script>
</body>
</html>
